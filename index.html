<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Tuna The Fishie - Bio Links</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#8d6e63">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tuna Bio">
    <link rel="apple-touch-icon" href="https://i.imgur.com/mbBY5Z4.jpeg">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-sky: #dff9fb;                     
            --bg-water: #c7ecee;                        
            --board-bg: #fffcf2;                   
            --board-border: #8d6e63;   
            --text-main: #4b4b4b;      
            --btn-fish: #48dbfb;       
            --btn-farm: #78e08f;       
            --btn-wood: #e1b12c;       
            --btn-market: #ff9ff3;     
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 100vh !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
        }

        body {
            background: linear-gradient(135deg, var(--bg-sky) 0%, var(--bg-water) 100%);
            color: var(--text-main);
            background-image: radial-gradient(rgba(255, 255, 255, 0.4) 2px, transparent 2px);
            background-size: 30px 30px;
            padding: 15px;
        }

        /* KHUNG BIO */
        .town-board {
            background-color: var(--board-bg);
            width: 100%;
            max-width: 450px; 
            border: 5px solid var(--board-border);
            border-radius: 36px; 
            box-shadow: 0 12px 0 rgba(141, 110, 99, 0.3); 
            padding: 35px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .town-board::before, .town-board::after {
            content: '';
            position: absolute;
            top: 15px;
            width: 14px;
            height: 14px;
            background: #b2bec3;
            border-radius: 50%;
            border: 2px solid var(--board-border);
            box-shadow: inset -2px -2px 0 rgba(0,0,0,0.2);
        }
        .town-board::before { left: 25px; }
        .town-board::after { right: 25px; }

        /* PROFILE */
        .profile-header {
            text-align: center;
            position: relative;
        }

        .avatar-frame {
            position: relative;
            width: 115px;
            height: 115px;
            margin: 0 auto 15px;
            background: #ffeaa7;
            border-radius: 40px; 
            border: 5px solid var(--board-border);
            padding: 5px;
            box-shadow: 0 6px 0 rgba(141, 110, 99, 0.2);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 32px;
        }

        .title-tag {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--btn-wood);
            color: #fff;
            border: 3px solid var(--board-border);
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.85rem;
            white-space: nowrap;
            box-shadow: 0 4px 0 rgba(141, 110, 99, 0.3);
        }

        .profile-name {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--board-border);
            margin-top: 10px;
        }

        .profile-bio {
            font-size: 1rem;
            color: #7f8c8d;
            font-weight: 700;
            margin-top: 5px;
        }

        /* LINKS */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-bubble {
            display: flex;
            align-items: center;
            padding: 16px 18px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.1rem;
            background: #ffffff;
            border: 4px solid var(--board-border);
            border-radius: 24px;
            position: relative;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 rgba(141, 110, 99, 0.2);
        }

        .link-bubble.fish { background-color: var(--btn-fish); color: #000; }
        .link-bubble.farm { background-color: var(--btn-farm); color: #000; }
        .link-bubble.wood { background-color: var(--btn-wood); color: #000; }
        .link-bubble.market { background-color: var(--btn-market); color: #000; }

        .link-icon {
            font-size: 1.4rem;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.4);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .link-text {
            flex-grow: 1;
            word-break: break-word;
        }

        .link-bubble:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 9px 0 rgba(141, 110, 99, 0.2);
        }

        .link-bubble:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 2px 0 rgba(141, 110, 99, 0.2);
        }

        /* SOCIAL BAR */
        .social-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 5px;
            padding-top: 16px;
            border-top: 3px dashed rgba(141, 110, 99, 0.3);
        }

        .social-icon {
            width: 46px;
            height: 46px;
            background: #ffffff;
            border: 3px solid var(--board-border);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            color: var(--board-border);
            text-decoration: none;
            box-shadow: 0 4px 0 rgba(141, 110, 99, 0.2);
            transition: all 0.15s ease;
        }

        .social-icon:hover {
            background: var(--btn-wood);
            color: #fff;
            transform: translateY(-3px) rotate(-10deg);
            box-shadow: 0 7px 0 rgba(141, 110, 99, 0.2);
        }
    </style>
</head>
<body>

    <main class="town-board">
        <header class="profile-header">
            <div class="avatar-frame">
                <img alt="Avatar" class="avatar-img" src="https://images-na.ssl-images-amazon.com/images/I/71zugj+EGpL.jpg">
                <div class="title-tag">Chủ Page</div>
            </div>
            <h1 class="profile-name">Tuna The Fishie</h1>
            <p class="profile-bio">Call me Tuna!</p>
        </header>

        <nav class="links-container">
            <a class="link-bubble fish" href="https://tunaptg.github.io/cns/">
                <div class="link-icon">📟</div>
                <div class="link-text">Cân nông sản</div>
            </a>

            <a class="link-bubble farm" href="https://tunaptg.github.io/kns">
                <div class="link-icon">🥕</div>
                <div class="link-text">Quản lý kho nông sản</div>
            </a>

            <a class="link-bubble wood" href="https://tunaptg.github.io/latthe">
                <div class="link-icon">🧩</div>
                <div class="link-text">Lật thẻ</div>
            </a>

            <a class="link-bubble market" href="https://tunaptg.github.io/textcode">
                <div class="link-icon">👇</div>
                <div class="link-text">Chữ màu/kiểu trang trí bảng chữ</div>
            </a>
        </nav>

        <footer class="social-bar">
            <a class="social-icon" href="https://www.tiktok.com/@_tuna.76" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-tiktok"></i>
            </a>
            <a class="social-icon" href="#">
                <i class="fa-brands fa-discord"></i>
            </a> 
            <a class="social-icon" href="https://zalo.me/0917246676" target="_blank" rel="noopener noreferrer">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg" alt="Zalo" style="width: 22px; height: 22px;">
            </a>
        </footer>
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('PWA đăng ký thành công!', reg.scope))
            .catch(err => console.log('PWA đăng ký thất bại:', err));
        });
      }
    </script>
</body>
</html>
